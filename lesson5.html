<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
    </head>
    <body>
       <h2>HTML Forms</h2> 
       <form action="">
        <fieldset>
            <!-- fieldset title -->
             <legend>Personal details</legend>
             <input type="text" name="" id="" placeholder="Your Name"> <br> <br>
             <input type="number" placeholder="Your ID number"> <br><br>
             <input type="email" placeholder="Your Email"> <br><br>
<input type="password" name="" id="" placeholder="Your Password"> <br>
<label for="">Your DOB</label> <br>
<input type="date" name="" id=""> <br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Your Interests</legend>
            <input type="checkbox" name="" id="">Football <br>
            <input type="checkbox" name="" id="">Volleyball <br>
            <input type="checkbox" name="" id="">Netball <br>

            <label for="">Your Gender</label> <br>
            <input type="radio" name="gender" id=""> Male
            <input type="radio" name="gender" id=""> Female <br>
            <label for="">Your PIC</label> <br>
            <input type="file" name="" id=""> <br><br>

            <label for="">Select Course</label>
            <select name="" id="">

                <option value="">Choose Course</option>
                <option value="">Computer Science</option>
                <option value="">Egineering</option>
                <option value="">Medicine</option>
            </select> <br><br>
</fieldset>
        <br>

<fieldset>
    <label for="">Leave a commennt</label> <br> <br>
    <textarea name="" id="" cols="50" rows="5"></textarea>
</fieldset>

<input type="submit" value="Make Application"> <br>
<input type="reset" name="" id="">
       </form>
    </body>
</html>
